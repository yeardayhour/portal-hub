server {
    listen 80;
    server_name localhost;

    # 0. Global Guestbook API Persistence
    location /api/guestbook {
        proxy_pass http://host.docker.internal:8006/api/guestbook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1. 포털 메인 대문 (portal-hub)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 2. FastAPI Lab 서브패스 라우팅 (OCI 8002번 방화벽 우회 80번 프록시)
    location /fastapi {
        return 301 /fastapi/;
    }

    location /fastapi/ {
        proxy_pass http://host.docker.internal:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Strike Game
    location /strike {
        return 301 /strike/;
    }

    location /strike/ {
        proxy_pass http://host.docker.internal:8003/strike/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. One Card Game
    location /onecard {
        return 301 /onecard/;
    }

    location /onecard/ {
        proxy_pass http://host.docker.internal:3005/onecard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /onecard/socket.io/ {
        proxy_pass http://host.docker.internal:8004/onecard/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Pokemantle
    location /pokemantle {
        return 301 /pokemantle/;
    }
    location /pokemantle/ {
        proxy_pass http://host.docker.internal:3000/pokemantle/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /pokemantle/api/ {
        proxy_pass http://host.docker.internal:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /pokemantle/sprites/ {
        proxy_pass http://host.docker.internal:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 6. Champdle
    location /champdle {
        return 301 /champdle/;
    }
    location /champdle/ {
        proxy_pass http://host.docker.internal:3100/champdle/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /champdle/api/ {
        proxy_pass http://host.docker.internal:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /champdle/sprites/ {
        proxy_pass http://host.docker.internal:8101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 7. LoLSearch
    location /lolsearch {
        return 301 /lolsearch/;
    }
    location /lolsearch/ {
        proxy_pass http://host.docker.internal:3200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /lolsearch/api/ {
        proxy_pass http://host.docker.internal:8200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
