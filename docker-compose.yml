version: "3.9"

services:
  portal-hub:
    image: nginx:alpine
    container_name: portal_hub
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  portal-backend:
    build: ./backend
    container_name: portal_backend
    restart: unless-stopped
    ports:
      - "8006:8006"
    volumes:
      - ./backend:/app
