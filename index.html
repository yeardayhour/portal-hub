<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>http://yeardayhour.duckdns.org/ | Portal</title>
  <meta name="description" content="yeardayhour.duckdns.org Microservices Portal & Guestbook">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
  <link rel="stylesheet" href="styles.css?v=4.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="dashboard-container">
    <!-- Minimal Header -->
    <header class="minimal-header">
      <div class="brand-box">
        <h1 class="logo">http://yeardayhour.duckdns.org/</h1>
        <p class="subtitle">Personal Microservices Portal</p>
      </div>

      <div class="header-right">
        <div class="clock-display">
          <span id="clock-time">00:00:00</span>
        </div>
      </div>
    </header>

    <!-- Services List Section (Row List format) -->
    <main>
      <div class="section-header">
        <h2>Services List</h2>
        <span class="service-count font-mono" id="service-count-text">7 Services</span>
      </div>

      <div id="services-list" class="minimal-list">
        <!-- Rendered dynamically as rows via script.js -->
      </div>
    </main>

    <!-- Guestbook Section (방명록) -->
    <section class="guestbook-section">
      <div class="section-header">
        <h2>💬 방명록 (Guestbook)</h2>
        <span class="service-count font-mono" id="guestbook-count-text">0 Messages</span>
      </div>

      <!-- Guestbook Form -->
      <form id="guestbook-form" class="guestbook-form">
        <div class="form-row">
          <input type="text" id="gb-nickname" placeholder="닉네임" required autocomplete="off" maxlength="20">
          <input type="text" id="gb-message" placeholder="방명록 메시지를 작성해주세요..." required autocomplete="off" maxlength="200">
          <button type="submit" class="submit-btn">작성하기</button>
        </div>
      </form>

      <!-- Guestbook Entries List -->
      <div id="guestbook-list" class="guestbook-list">
        <!-- Rendered via script.js -->
      </div>
    </section>

    <!-- Minimal Footer -->
    <footer class="minimal-footer">
      <p>© 2026 http://yeardayhour.duckdns.org/ · All Rights Reserved.</p>
    </footer>
  </div>

  <script src="config.js?v=1.4"></script>
  <script src="script.js?v=4.0"></script>
</body>
</html>
