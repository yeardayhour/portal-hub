<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>http://yeardayhour.duckdns.org/ | Portal</title>
  <meta name="description" content="yeardayhour.duckdns.org Microservices Portal & Guestbook">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
  <link rel="stylesheet" href="styles.css?v=10.0">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <!-- Top Accent Beam -->
  <div class="top-accent-line"></div>

  <!-- Background Glow Orbs -->
  <div class="bg-glow-orb orb-1"></div>
  <div class="bg-glow-orb orb-2"></div>

  <div class="dashboard-container">
    <!-- Header Section -->
    <header class="portal-header">
      <div class="header-left">
        <div class="status-pill">
          <span class="pulse-dot"></span>
          <span>ONLINE PORTAL</span>
        </div>
        <h1 class="portal-title">http://yeardayhour.duckdns.org/</h1>
        <p class="portal-subtitle">Oracle Cloud Infrastructure & Microservices Hub</p>
      </div>

      <div class="header-right">
        <button id="copy-portal-btn" class="fold-toggle-btn" title="포털 주소 복사하기">
          <i class="ph-bold ph-copy"></i>
          <span>링크 복사</span>
        </button>
        <div class="clock-badge">
          <i class="ph ph-clock"></i>
          <span id="clock-time">00:00:00</span>
        </div>
      </div>
    </header>

    <!-- Services List Section -->
    <main class="services-section">
      <div class="section-header">
        <div class="section-title-wrap">
          <h2>Services Catalog</h2>
          <span class="service-count-badge font-mono" id="service-count-text">6 Active</span>
        </div>
        <button id="toggle-services-btn" class="fold-toggle-btn" title="목록 접기/펼치기">
          <span id="toggle-btn-text">접기</span>
          <i id="toggle-btn-icon" class="ph-bold ph-caret-up"></i>
        </button>
      </div>

      <div id="services-list" class="services-list-container">
        <!-- Rendered dynamically via script.js -->
      </div>
    </main>

    <!-- Guestbook Section (방명록) -->
    <section class="guestbook-section">
      <div class="section-header">
        <div class="section-title-wrap">
          <h2>Guestbook</h2>
          <span class="service-count-badge font-mono" id="guestbook-count-text">0 Messages</span>
        </div>
      </div>

      <!-- Guestbook Form -->
      <form id="guestbook-form" class="guestbook-form-card">
        <div class="form-grid">
          <div class="input-group">
            <i class="ph ph-user"></i>
            <input type="text" id="gb-nickname" placeholder="닉네임" required autocomplete="off" maxlength="20">
          </div>
          <div class="input-group">
            <i class="ph ph-lock-key"></i>
            <input type="password" id="gb-password" placeholder="비밀번호" required autocomplete="off" maxlength="20">
          </div>
          <div class="input-group flex-1">
            <i class="ph ph-pencil-line"></i>
            <input type="text" id="gb-message" placeholder="방명록 메시지를 남겨주세요..." required autocomplete="off" maxlength="200">
          </div>
          <button type="submit" class="submit-action-btn">
            <span>작성</span>
            <i class="ph-bold ph-paper-plane-tilt"></i>
          </button>
        </div>
      </form>

      <!-- Guestbook Entries List -->
      <div id="guestbook-list" class="guestbook-entries-list">
        <!-- Rendered via script.js -->
      </div>
    </section>

    <!-- Footer Section -->
    <footer class="portal-footer">
      <p>© 2026 http://yeardayhour.duckdns.org/ · All Rights Reserved.</p>
    </footer>
  </div>

  <script src="config.js?v=1.3"></script>
  <script src="script.js?v=10.0"></script>
</body>
</html>
