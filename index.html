<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yeardayhour.hub | OCI Minimal Dashboard</title>
  <meta name="description" content="Oracle Cloud Infrastructure & Microservices Dashboard">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
  <link rel="stylesheet" href="styles.css?v=3.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="dashboard-container">
    <!-- Minimal Header -->
    <header class="minimal-header">
      <div class="brand-box">
        <h1 class="logo">yeardayhour<span>.hub</span></h1>
        <p class="subtitle">Oracle Cloud Microservices</p>
      </div>

      <div class="header-right">
        <div class="status-badge">
          <span class="status-dot"></span>
          <span>All Systems Operational</span>
        </div>
        <div class="clock-display">
          <span id="clock-time">00:00:00</span>
        </div>
      </div>
    </header>

    <!-- Services Grid -->
    <main>
      <div class="section-header">
        <h2>Active Services</h2>
        <span class="service-count font-mono" id="service-count-text">7 Services</span>
      </div>

      <div id="cards-grid" class="minimal-grid">
        <!-- Rendered via script.js -->
      </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="minimal-footer">
      <p>© 2026 yeardayhour.hub · Powered by Oracle Cloud Infrastructure</p>
    </footer>
  </div>

  <script src="config.js?v=1.3"></script>
  <script src="script.js?v=3.0"></script>
</body>
</html>
